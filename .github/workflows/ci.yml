name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"  # versão mínima suportada
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Identidade git para os testes
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Barreira de privacidade
        run: python tools/privacy_gate.py
      - name: Testes
        run: python tests/run_tests.py
